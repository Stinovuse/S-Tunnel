name: Build & release

# Каждый push в main собирает установщик.
# Если версии из package.json ещё нет в Releases — создаётся релиз vX.Y.Z
# с установщиком и latest.yml (по нему приложение находит обновления).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SING_BOX_VERSION: '1.13.19'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download sing-box core
        shell: pwsh
        run: |
          $v = $env:SING_BOX_VERSION
          $name = "sing-box-$v-windows-amd64"
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/releases/download/v$v/$name.zip" -OutFile sb.zip
          Expand-Archive sb.zip -DestinationPath sb -Force
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item "sb/$name/*" bin/ -Recurse -Force
          ./bin/sing-box.exe version

      - name: Validate generated configs with real sing-box
        shell: pwsh
        run: |
          node test/config.test.js --write sb-test.json
          ./bin/sing-box.exe check -c sb-test.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./bin/sing-box.exe check -c sb-test-socks.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./bin/sing-box.exe check -c sb-test-excl.json
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - run: npm install --no-audit --no-fund

      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: S-Tunnel-Setup
          path: |
            dist/*.exe
            dist/latest.yml

      - name: Is this a new version?
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { "new=false" >> $env:GITHUB_OUTPUT; Write-Host "v$v already released" }
          else { "new=true" >> $env:GITHUB_OUTPUT; Write-Host "New version v$v" }
          exit 0

      - name: Publish release
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: S Tunnel ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: CHANGELOG-latest.md
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
